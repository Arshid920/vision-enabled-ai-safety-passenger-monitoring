<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BoatSafetyAI{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1e;
            --bg-secondary: #0d1528;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --accent2: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f4ff;
            --text-muted: #8b9bb4;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: transparent !important;
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: url('/static/floating_boat_bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            animation: boat-float 60s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 8, 20, 0.45);
            z-index: -1;
        }

        @keyframes boat-float {
            0% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-2%) translateX(1%) scale(1.02);
            }

            100% {
                transform: translateY(-1%) translateX(-2%) scale(1.04);
            }
        }

        /* ── NAVBAR ──────────────────────────────────────────────── */
        .navbar {
            background: rgba(10, 15, 30, 0.85) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: .85rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            transition: color .2s;
        }

        .nav-link:hover {
            color: var(--accent) !important;
        }

        /* ── GLASS CARD ──────────────────────────────────────────── */
        .glass {
            background: rgba(4, 15, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            transition: transform .25s, box-shadow .25s, border-color .25s;
        }

        .glass:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* ── FORM CONTROLS ───────────────────────────────────────── */
        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            border-radius: .75rem !important;
            padding: .7rem 1rem !important;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px var(--accent-glow) !important;
            outline: none !important;
        }

        .form-control::placeholder {
            color: var(--text-muted) !important;
        }

        label.form-label {
            color: var(--text-muted);
            font-size: .85rem;
            font-weight: 500;
            margin-bottom: .4rem;
        }

        /* ── BUTTONS ─────────────────────────────────────────────── */
        .btn-primary {
            background: linear-gradient(135deg, #00e0ff, #3b82f6) !important;
            border: none !important;
            color: #000 !important;
            border-radius: .75rem !important;
            font-weight: 700;
            letter-spacing: .02em;
            padding: .72rem 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 224, 255, 0.4);
            transition: opacity .2s, transform .15s, box-shadow .2s;
        }

        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 224, 255, 0.6);
            color: #000 !important;
        }

        .btn-outline-primary {
            border: 1.5px solid #00e0ff !important;
            color: #00e0ff !important;
            border-radius: .75rem !important;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.2) !important;
            transition: background .2s, color .2s;
        }

        .btn-outline-primary:hover {
            background: rgba(0, 224, 255, 0.15) !important;
            color: #ffffff !important;
        }

        .btn-outline-danger {
            border: 1.5px solid var(--danger) !important;
            color: var(--danger) !important;
            border-radius: .75rem !important;
            font-weight: 600;
            background: transparent !important;
        }

        .btn-outline-danger:hover {
            background: var(--danger) !important;
            color: #fff !important;
        }

        /* ── ALERTS ──────────────────────────────────────────────── */
        .alert {
            border-radius: .85rem !important;
            border: none !important;
            font-weight: 500;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15) !important;
            color: #fca5a5 !important;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15) !important;
            color: #86efac !important;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.15) !important;
            color: #fcd34d !important;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.15) !important;
            color: #93c5fd !important;
        }

        /* ── BADGE ───────────────────────────────────────────────── */
        .badge {
            border-radius: .5rem !important;
            font-weight: 600 !important;
        }

        /* ── TABLES ──────────────────────────────────────────────── */
        .table {
            color: var(--text-primary) !important;
        }

        .table th {
            color: var(--text-muted) !important;
            font-size: .8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            border-color: var(--glass-border) !important;
        }

        .table td {
            border-color: rgba(255, 255, 255, 0.05) !important;
            vertical-align: middle;
        }

        .table-hover tbody tr:hover td {
            background: rgba(255, 255, 255, 0.04) !important;
        }

        thead.table-light th {
            background: rgba(255, 255, 255, 0.04) !important;
        }

        /* ── STAT CARD ───────────────────────────────────────────── */
        .stat-card {
            background: rgba(4, 15, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.4rem 1.2rem;
            text-align: center;
            transition: transform .2s, box-shadow .2s, border-color .2s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .stat-card .stat-val {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .stat-card .stat-label {
            font-size: .78rem;
            color: var(--text-muted);
            margin-top: .35rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        /* ── SECTION HEADER ──────────────────────────────────────── */
        .section-head {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            padding: .9rem 1.2rem;
            font-size: .85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .07em;
            border-radius: 1.25rem 1.25rem 0 0;
        }

        /* ── MISC ────────────────────────────────────────────────── */
        a {
            color: var(--accent);
        }

        a:hover {
            color: var(--accent2);
        }

        hr {
            border-color: var(--glass-border);
        }

        code {
            color: var(--accent2);
            background: rgba(6, 182, 212, 0.12);
            padding: .15em .45em;
            border-radius: .35rem;
        }

        /* ── PULSE INDICATOR ─────────────────────────────────────── */
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(34, 197, 94, .6);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, .6)
            }

            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0)
            }
        }

        /* ── FADE-IN ─────────────────────────────────────────────── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .fade-up {
            animation: fadeUp .5s ease both;
        }

        .fade-up-d1 {
            animation-delay: .08s;
        }

        .fade-up-d2 {
            animation-delay: .16s;
        }

        .fade-up-d3 {
            animation-delay: .24s;
        }

        .fade-up-d4 {
            animation-delay: .32s;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">🚤 BoatSafetyAI</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span style="color:var(--text-muted)">☰</span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/login?role=driver">Driver Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/login?role=admin">Admin Login</a></li>
                    <li class="nav-item ms-2">
                        <a class="btn btn-primary btn-sm px-3" href="/auth/register">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
